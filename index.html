<!DOCTYPE html>\n<html lang="en">\n<head>\n    <meta charset="UTF-8">\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">\n    <title>Retro Claw Machine Game</title>\n    <style>\n        body {\n            display: flex;\n            flex-direction: column;\n            align-items: center;\n            background-color: #000;\n            color: #fff;\n        }\n        canvas {\n            border: 2px solid #fff;\n            background: #222;\n        }\n        #score {\n            font-size: 24px;\n            margin: 10px;\n        }\n    </style>\n</head>\n<body>\n    <h1>Retro Claw Machine Game</h1>\n    <canvas id="gameCanvas" width="480" height="320"></canvas>\n    <div id="score">Score: 0</div>\n    <button id="startGame">Start Game</button>\n    <script>\n        const canvas = document.getElementById('gameCanvas');\n        const ctx = canvas.getContext('2d');\n        let clawX = canvas.width / 2;\n        let prizes = [];\n        let score = 0;\n        let gameInterval;\n        let clawMoving = false;\n\n        class Prize {\n            constructor(x, y) {\n                this.x = x;\n                this.y = y;\n                this.width = 30;\n                this.height = 30;\n                this.color = this.getRandomColor();\n            }\n            getRandomColor() {\n                const colors = ['#FF5733', '#33FF57', '#3357FF', '#FF33A1', '#F4A300'];\n                return colors[Math.floor(Math.random() * colors.length)];\n            }\n            draw() {\n                ctx.fillStyle = this.color;\n                ctx.fillRect(this.x, this.y, this.width, this.height);\n            }\n        }\n\n        function startGame() {\n            clawX = canvas.width / 2;\n            score = 0;\n            prizes = [];\n            gameInterval = setInterval(gameLoop, 100);\n            createPrizes(5);\n            document.getElementById('score').innerText = 'Score: ' + score;\n        }\n\n        function createPrizes(amount) {\n            for (let i = 0; i < amount; i++) {\n                const prizeX = Math.random() * (canvas.width - 30);\n                const prizeY = Math.random() * (canvas.height - 30);\n                prizes.push(new Prize(prizeX, prizeY));\n            }\n        }\n\n        function gameLoop() {\n            ctx.clearRect(0, 0, canvas.width, canvas.height);\n            drawClaw();\n            drawPrizes();\n            detectCollision();\n        }\n\n        function drawClaw() {\n            ctx.fillStyle = '#FFD700';\n            ctx.fillRect(clawX - 15, canvas.height - 30, 30, 10);\n        }\n\n        function drawPrizes() {\n            prizes.forEach(prize => prize.draw());\n        }\n\n        function detectCollision() {\n            prizes = prizes.filter(prize => {\n                if (clawX - 15 < prize.x + prize.width &&\n                    clawX + 15 > prize.x &&\n                    canvas.height - 30 < prize.y + prize.height &&\n                    canvas.height - 20 > prize.y) {\n                    score += 10;\n                    return false; // Remove prize from array\n                }\n                return true; // Keep prize in the array\n            });\n            document.getElementById('score').innerText = 'Score: ' + score;\n        }\n\n        document.getElementById('startGame').addEventListener('click', startGame);\n        window.addEventListener('touchmove', function(event) {\n            clawX = event.touches[0].clientX - canvas.offsetLeft;\n            clawX = Math.max(15, Math.min(clawX, canvas.width - 15));\n        });\n    </script>\n</body>\n</html>
